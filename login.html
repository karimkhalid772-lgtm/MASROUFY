<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>مصروفي | تسجيل الدخول</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="auth.css">
</head>

<body>

  <main class="auth-page">

    <section class="auth-brand">

      <img src="MASROUFY-logo-transparent.png" alt="مصروفي">

      <h1>مصروفي</h1>

      <p>Personal Finance · Tracker · Insights</p>

      <div class="quote">
        "القرش الأبيض ينفع في اليوم الأسود."
      </div>

    </section>

    <section class="auth-card">

      <div class="tabs">
        <button class="tab active" id="loginTab">
          تسجيل الدخول
        </button>

        <button class="tab" id="registerTab">
          حساب جديد
        </button>
      </div>

      <form id="loginForm">

        <h2>أهلاً بيك 👋</h2>

        <p class="muted">
          سجّل دخولك علشان تتابع مصاريفك.
        </p>

        <label>البريد الإلكتروني</label>

        <input
          id="loginEmail"
          type="email"
          required
          autocomplete="email"
        >

        <label>كلمة المرور</label>

        <input
          id="loginPassword"
          type="password"
          required
          autocomplete="current-password"
        >

        <button class="primary-btn" type="submit">
          دخول
        </button>

        <p id="loginMessage" class="message"></p>

      </form>

      <form id="registerForm" class="hidden">

        <h2>اعمل حسابك</h2>

        <p class="muted">
          بياناتك هتكون منفصلة عن باقي المستخدمين.
        </p>

        <label>الاسم</label>

        <input
          id="registerName"
          type="text"
          minlength="2"
          required
          autocomplete="name"
        >

        <label>البريد الإلكتروني</label>

        <input
          id="registerEmail"
          type="email"
          required
          autocomplete="email"
        >

        <label>كلمة المرور</label>

        <input
          id="registerPassword"
          type="password"
          minlength="6"
          required
          autocomplete="new-password"
        >

        <label>تأكيد كلمة المرور</label>

        <input
          id="registerConfirm"
          type="password"
          minlength="6"
          required
          autocomplete="new-password"
        >

        <button class="primary-btn" type="submit">
          إنشاء الحساب
        </button>

        <p id="registerMessage" class="message"></p>

      </form>

    </section>

  </main>

  <script src="auth.js"></script>

</body>
</html>
